name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false
      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - run: go run ./cmd/lb lint
      - run: go test -race -count=1 ./...
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify generated comparison report
        run: |
          python3 -B -m unittest discover -s site -p 'test_*.py'
          python3 -B site/check.py
